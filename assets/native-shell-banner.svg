<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="native-shell: Bash, native on Windows. No WSL, no VM, no emulation layer.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1230"/>
      <stop offset="55%" stop-color="#131b39"/>
      <stop offset="100%" stop-color="#1a2854"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#08f8f8"/>
      <stop offset="55%" stop-color="#f0c070"/>
      <stop offset="100%" stop-color="#ffd28a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <rect x="0" y="294" width="1200" height="6" fill="url(#accent)"/>

  <!-- Bull from our official ICO (assets/native-shell-icon.ico, 256px PNG entry, embedded as data URI) -->
  <image href="data:image/png;base64," x="88" y="60" width="180" height="180"/>
  <rect x="88" y="60" width="180" height="180" rx="38" fill="none" stroke="#f0c070" stroke-opacity="0.4" stroke-width="2"/>

  <text x="340" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="1" fill="#ffffff">native-shell</text>
  <text x="344" y="187" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="25" fill="#9fb0c8">Bash, native on Windows. No WSL, no VM.</text>

  <rect x="344" y="216" width="220" height="46" rx="23" fill="#151c30" stroke="#2b3a5c" stroke-width="1.5"/>
  <text x="454" y="246" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="19" font-weight="700" fill="#3fb950">no emulation layer</text>
  <rect x="584" y="216" width="108" height="46" rx="23" fill="#151c30" stroke="#2b3a5c" stroke-width="1.5"/>
  <text x="638" y="246" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="19" font-weight="700" fill="#08f8f8">no WSL</text>
  <rect x="712" y="216" width="108" height="46" rx="23" fill="#151c30" stroke="#2b3a5c" stroke-width="1.5"/>
  <text x="766" y="246" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="19" font-weight="700" fill="#f0c070">no VM</text>
</svg>